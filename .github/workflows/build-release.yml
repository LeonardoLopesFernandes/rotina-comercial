name: Build Release APK (arm64-v8a)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (arm64-v8a, release)
        run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk rotina-comercial-arm64-v8a-release.apk

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: Rotina Comercial (${{ github.ref_type == 'tag' && github.ref_name || 'latest' }})
          body: |
            Build automático a partir do commit `${{ github.sha }}`.
            APK **arm64-v8a** (release), otimizado e menor.
            Instale sobre a versão anterior para atualizar (versionCode crescente).
          files: rotina-comercial-arm64-v8a-release.apk
          overwrite: true
          make_latest: true
